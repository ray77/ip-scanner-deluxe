name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.3
      - name: Dependency licenses and sources
        run: cargo deny --locked check licenses sources
      - name: THIRD-PARTY-NOTICES.txt is up to date
        run: |
          cargo fetch --locked
          cargo xtask third-party-notices
          git diff --exit-code THIRD-PARTY-NOTICES.txt || { echo "::error::THIRD-PARTY-NOTICES.txt is outdated: run cargo xtask third-party-notices"; exit 1; }

  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  build-windows:
    needs: [fmt]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p ip-scanner-deluxe
      - name: Check DLL dependencies
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents target/release/IPScannerDeluxe.exe
          $deps
          if ($deps -match 'VCRUNTIME|MSVCP|api-ms-win-crt') { throw "IPScannerDeluxe.exe must not depend on the Visual C++ runtime" }
      # The runner is a VM without a GPU driver (only OpenGL 1.1), like many
      # Windows Server and virtual machines: the window must still open, by
      # default (OpenGL with Direct3D fallback) and with Direct3D forced.
      - name: Start test without GPU
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $env:IPSD_LOG = "debug"
          $env:RUST_BACKTRACE = "1"
          $out = "$env:RUNNER_TEMP\start-test"
          New-Item -ItemType Directory -Force $out | Out-Null
          $log = "$env:APPDATA\IPScannerDeluxe\logs\ip-scanner-deluxe.log"
          $failed = @()
          foreach ($renderer in 'default', 'wgpu') {
            if ($renderer -eq 'default') { Remove-Item Env:IPSD_RENDERER -ErrorAction SilentlyContinue } else { $env:IPSD_RENDERER = $renderer }
            Remove-Item $log -ErrorAction SilentlyContinue
            $shot = "$out\$renderer.png"
            $p = Start-Process target/release/IPScannerDeluxe.exe -ArgumentList '--demo', '--english', '--screenshot', $shot -PassThru `
              -RedirectStandardOutput "$out\$renderer-stdout.txt" -RedirectStandardError "$out\$renderer-stderr.txt"
            if (-not $p.WaitForExit(90000)) {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("$out\$renderer-desktop-timeout.png")
              $p.Kill()
              Write-Host "::warning::$renderer renderer timed out"
            }
            Write-Host "===== ${renderer}: exit $($p.ExitCode) ====="
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content "$out\$renderer-stderr.txt" -ErrorAction SilentlyContinue
            Copy-Item $log "$out\$renderer.log" -ErrorAction SilentlyContinue
            if (-not (Test-Path $shot)) { $failed += $renderer }
          }
          if ($failed) { throw "the main window did not open: $failed" }
      - name: Renderer benchmark (temporary)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:IPSD_RENDERER = "wgpu"
          $cases = @(
            @{ n = "autovsync";            p = "";            l = "";  s = "653x473" },
            @{ n = "autovsync-1366";       p = "";            l = "";  s = "1366x768" },
            @{ n = "autonovsync";          p = "autonovsync"; l = "";  s = "653x473" },
            @{ n = "immediate";            p = "immediate";   l = "";  s = "653x473" },
            @{ n = "fifo-latency1";        p = "fifo";        l = "1"; s = "653x473" },
            @{ n = "autonovsync-1366";     p = "autonovsync"; l = "";  s = "1366x768" }
          )
          foreach ($c in $cases) {
            $env:IPSD_PRESENT_MODE = $c.p
            $env:IPSD_FRAME_LATENCY = $c.l
            $err = "$env:RUNNER_TEMP\bench-$($c.n).txt"
            $p = Start-Process target/release/IPScannerDeluxe.exe -ArgumentList '--demo', '--expand', '--english', '--bench', '--size', $c.s -PassThru -RedirectStandardError $err
            if (-not $p.WaitForExit(60000)) { $p.Kill() }
            Write-Host "$($c.n): $(Get-Content $err -ErrorAction SilentlyContinue)"
          }
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfLogicalProcessors
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: start-test-windows
          path: ${{ runner.temp }}/start-test
          retention-days: 7
          if-no-files-found: ignore
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/IPScannerDeluxe | Out-Null
          Copy-Item target/release/IPScannerDeluxe.exe dist/IPScannerDeluxe/
          Copy-Item README.md, README.de.md, LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-NOTICES.txt dist/IPScannerDeluxe/
          New-Item -ItemType File dist/IPScannerDeluxe/portable.flag | Out-Null
          Compress-Archive -Path dist/IPScannerDeluxe -DestinationPath dist/IPScannerDeluxe-windows-x86_64-portable.zip
          Copy-Item target/release/IPScannerDeluxe.exe dist/IPScannerDeluxe.exe
      - uses: actions/upload-artifact@v4
        with:
          name: IPScannerDeluxe-windows-x86_64
          path: |
            dist/IPScannerDeluxe.exe
            dist/IPScannerDeluxe-windows-x86_64-portable.zip

  # Microsoft Store package. The uploaded .msix is unsigned: Partner Center
  # signs it after certification. A throwaway self-signed certificate is only
  # used to prove the package installs; it never leaves the runner.
  build-msix:
    needs: [fmt]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: store
      - run: cargo build --release --locked -p ip-scanner-deluxe --features store
      - name: Build MSIX
        id: msix
        shell: pwsh
        run: ./packaging/windows/msix/scripts/build-msix.ps1 -Exe target/release/IPScannerDeluxe.exe -OutDir dist -RequireStoreIdentity
      - name: Verify package contents
        shell: pwsh
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $makeappx = Get-ChildItem $kits -Recurse -Filter makeappx.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName unpack /o /p "${{ steps.msix.outputs.msix }}" /d dist/unpacked
          if ($LASTEXITCODE) { throw "unpack failed" }
          Get-ChildItem dist/unpacked -Recurse | Select-Object -ExpandProperty FullName
          [xml]$m = Get-Content dist/unpacked/AppxManifest.xml
          $app = $m.Package.Applications.Application
          $checks = @{
            "version"           = $m.Package.Identity.Version -eq "${{ steps.msix.outputs.version }}"
            "packagedClassicApp" = $app.RuntimeBehavior -eq "packagedClassicApp"
            "mediumIL"          = $app.TrustLevel -eq "mediumIL"
            "runFullTrust"      = $m.OuterXml -match 'Capability Name="runFullTrust"'
            "exe"               = Test-Path dist/unpacked/IPScannerDeluxe.exe
            "licenses"          = (Test-Path dist/unpacked/LICENSE-MIT) -and (Test-Path dist/unpacked/LICENSE-APACHE) -and (Test-Path dist/unpacked/THIRD-PARTY-NOTICES.txt)
            "no portable.flag"  = -not (Get-ChildItem dist/unpacked -Recurse -Filter portable.flag)
            "no keys"           = -not (Get-ChildItem dist/unpacked -Recurse -Include *.pfx, *.p12, *.pem, *.key)
          }
          $checks.GetEnumerator() | ForEach-Object { "{0,-20} {1}" -f $_.Key, $_.Value }
          if ($checks.Values -contains $false) { throw "MSIX verification failed" }
      - name: Test install with a throwaway certificate
        shell: pwsh
        run: |
          Copy-Item "${{ steps.msix.outputs.msix }}" $env:RUNNER_TEMP/test.msix
          $out = & ./packaging/windows/msix/scripts/new-test-certificate.ps1 -CerFile $env:RUNNER_TEMP/test.cer
          $out
          $thumb = (Get-ChildItem Cert:\CurrentUser\My | Where-Object FriendlyName -like "IP Scanner Deluxe MSIX test*" | Select-Object -First 1).Thumbprint
          Import-Certificate -FilePath $env:RUNNER_TEMP/test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signtool = Get-ChildItem $kits -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /sha1 $thumb /s My $env:RUNNER_TEMP/test.msix
          if ($LASTEXITCODE) { throw "signing failed" }
          Add-AppxPackage -Path $env:RUNNER_TEMP/test.msix
          $pkg = Get-AppxPackage -Name (Get-Content packaging/windows/msix/store-identity.json -Raw | ConvertFrom-Json).IdentityName
          $pkg | Format-List Name, Version, Architecture, SignatureKind, InstallLocation
          if (-not $pkg) { throw "package not installed" }
          if (Test-Path (Join-Path $pkg.InstallLocation "portable.flag")) { throw "portable.flag installed" }
          Remove-AppxPackage -Package $pkg.PackageFullName
          Remove-Item "Cert:\CurrentUser\My\$thumb"
      - uses: actions/upload-artifact@v4
        with:
          name: msix-store-x64
          path: ${{ steps.msix.outputs.msix }}
          retention-days: 90

  build-linux:
    needs: [fmt]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p ip-scanner-deluxe
      - name: tar.gz
        run: |
          VERSION=$(cargo pkgid -p ip-scanner-deluxe | sed 's/.*[#@]//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist/IPScannerDeluxe
          cp target/release/IPScannerDeluxe README.md README.de.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt dist/IPScannerDeluxe/
          cp packaging/linux/ip-scanner-deluxe.desktop packaging/icons/ip-scanner-deluxe.png dist/IPScannerDeluxe/
          tar -C dist -czf dist/IPScannerDeluxe-linux-${{ matrix.arch }}.tar.gz IPScannerDeluxe
      - name: deb
        run: |
          R=dist/deb
          install -Dm755 target/release/IPScannerDeluxe $R/usr/bin/IPScannerDeluxe
          install -Dm644 packaging/linux/ip-scanner-deluxe.desktop $R/usr/share/applications/ip-scanner-deluxe.desktop
          install -Dm644 packaging/icons/ip-scanner-deluxe.png $R/usr/share/icons/hicolor/512x512/apps/ip-scanner-deluxe.png
          install -Dm644 LICENSE-MIT $R/usr/share/doc/ip-scanner-deluxe/LICENSE-MIT
          install -Dm644 LICENSE-APACHE $R/usr/share/doc/ip-scanner-deluxe/LICENSE-APACHE
          install -Dm644 THIRD-PARTY-NOTICES.txt $R/usr/share/doc/ip-scanner-deluxe/THIRD-PARTY-NOTICES.txt
          install -Dm755 packaging/linux/postinst $R/DEBIAN/postinst
          sed -e "s/@VERSION@/$VERSION/" -e "s/@ARCH@/${{ matrix.deb_arch }}/" packaging/linux/control > $R/DEBIAN/control
          dpkg-deb --root-owner-group --build $R dist/ip-scanner-deluxe_${VERSION}_${{ matrix.deb_arch }}.deb
      - name: AppImage
        run: |
          A=dist/IPScannerDeluxe.AppDir
          install -Dm755 target/release/IPScannerDeluxe $A/usr/bin/IPScannerDeluxe
          install -Dm644 packaging/linux/ip-scanner-deluxe.desktop $A/ip-scanner-deluxe.desktop
          install -Dm644 packaging/icons/ip-scanner-deluxe.png $A/ip-scanner-deluxe.png
          ln -s usr/bin/IPScannerDeluxe $A/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage
          chmod +x appimagetool
          ARCH=${{ matrix.arch }} ./appimagetool --appimage-extract-and-run $A dist/IPScannerDeluxe-linux-${{ matrix.arch }}.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: IPScannerDeluxe-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage

  build-macos:
    needs: [fmt]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            target: aarch64-apple-darwin
          - name: macos-intel
            target: x86_64-apple-darwin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo xtask bundle-macos ${{ matrix.target }}
      - name: DMG
        run: |
          mv dist/IPScannerDeluxe-macos.zip dist/IPScannerDeluxe-${{ matrix.name }}.zip
          hdiutil create -volname "IP Scanner Deluxe" -srcfolder "dist/IP Scanner Deluxe.app" -ov -format UDZO dist/IPScannerDeluxe-${{ matrix.name }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: IPScannerDeluxe-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [clippy, test, licenses, build-windows, build-msix, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # GitHub release assets only; the Store MSIX (msix-store-x64) goes to Partner Center.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: IPScannerDeluxe-*
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*
      - uses: softprops/action-gh-release@v2
        with:
          name: IP Scanner Deluxe ${{ steps.version.outputs.version }}
          files: artifacts/*
