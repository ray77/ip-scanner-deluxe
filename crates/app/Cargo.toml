[package]
name = "ip-scanner-deluxe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "IP Scanner Deluxe: fast, free, cross-platform IP scanner and LAN network scanner"
repository.workspace = true
homepage.workspace = true
keywords = ["ip-scanner", "network-scanner", "lan-scanner", "network", "scanner"]
categories = ["network-programming", "gui"]

[features]
default = []
# Microsoft Store / MSIX build: ignores portable.flag, updates come from the Store.
store = []
# Optional for Store builds: hide remote shutdown/restart should certification require it.
store-no-remote-shutdown = ["store"]

[[bin]]
name = "IPScannerDeluxe"
path = "src/main.rs"

[dependencies]
ui.workspace = true
scan-core.workspace = true
storage.workspace = true
platform.workspace = true
protocols.workspace = true
vendor-db.workspace = true
fingerprint.workspace = true
eframe.workspace = true
egui.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rfd.workspace = true
csv.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open.workspace = true
# CPU renderer: used automatically on Windows without a GPU, elsewhere via IPSD_RENDERER=software.
egui_software_backend = { version = "0.0.2", default-features = false, features = ["std", "winit", "rayon"] }

# Windows: Direct3D 12 renderer as fallback where a GPU has no usable OpenGL
# driver; wgpu also detects machines without a GPU (see has_gpu in main.rs).
[target."cfg(windows)".dependencies]
eframe = { workspace = true, features = ["wgpu"] }
wgpu = { version = "27", default-features = false, features = ["dx12"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"



[package.metadata.bundle]
name = "IP Scanner Deluxe"
identifier = "org.ipscannerdeluxe.app"
