# cargo-deny configuration: `cargo deny check licenses sources`.
#
# The allow list reflects an audit of Cargo.lock (all targets). Every
# dependency license is permissive or public domain (CC0-1.0, one crate); the
# only weak copyleft licenses are MPL-2.0 (one crate, file-level, unmodified)
# and the font licenses of the fonts bundled with egui. Anything else, in particular GPL/AGPL/LGPL-only
# crates or an unknown license, fails the check and needs a deliberate review.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    # Fonts bundled by epaint_default_fonts (Ubuntu Light, Hack, Noto Emoji, emoji-icon-font).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
exceptions = [
    # Used unmodified by `directories`; MPL-2.0 is file-level copyleft and allows static linking.
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # Public-domain dedication; used by the wgpu shader compiler (naga), Windows only.
    { allow = ["CC0-1.0"], crate = "hexf-parse" },
]

[licenses.private]
# Workspace crates are not published; their license (MIT OR Apache-2.0) is set in the workspace.
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
