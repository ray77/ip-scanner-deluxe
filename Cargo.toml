[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/ui",
    "crates/scan-core",
    "crates/platform",
    "crates/protocols",
    "crates/vendor-db",
    "crates/fingerprint",
    "crates/storage",
    "xtask",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Dominik Schmidt"]
repository = "https://github.com/ray77/ip-scanner-deluxe"
homepage = "https://github.com/ray77/ip-scanner-deluxe"
rust-version = "1.90"

[workspace.dependencies]
vendor-db = { path = "crates/vendor-db" }
fingerprint = { path = "crates/fingerprint" }
protocols = { path = "crates/protocols" }
platform = { path = "crates/platform" }
scan-core = { path = "crates/scan-core" }
storage = { path = "crates/storage" }
ui = { path = "crates/ui" }

eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.33"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-util = "0.7"
futures = "0.3"
mdns-sd = "0.21"
redb = "4"
netdev = "0.47"
socket2 = { version = "0.6", features = ["all"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland", "common-controls-v6"] }
directories = "6"
sys-locale = "0.3"
dns-lookup = "4"
regex = "1"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ipnet = "2"
open = "5"
libc = "0.2"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
